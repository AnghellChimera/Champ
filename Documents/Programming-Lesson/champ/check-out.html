            <div class="row">
                <!-- first section -->
                <div class="col-lg-5 col-xl-6">
                    <form action="post" id="paymentDetails">
                        <fieldset style="min-width: 0; width: 100%;">
                            <legend class="check pt-3 pb-5">Checkout</legend>
                            <div class="col-lg-12 pb-4">
                                <label for="fullName" class="form-text pb-2">Cardholder’s Name</label>
                                <input type="text" class="form py-2 w-100 ps-2 ps-lg-3 rounded-2" id="fullName"
                                    name="fullName" placeholder="Olakanmi Olabimpe" required>
                            </div>
                            <div class=" col-lg-12 pb-4">
                                <label for="cardNumber" class="form-text pb-2">Card’s Number</label>
                                <input type="text" class="form py-2 w-100 ps-2 ps-lg-3 rounded-2" inputmode="numeric"
                                    name="cardNumber" autocomplete="cc-number" placeholder="**** **** **** ****"
                                    maxlength="19" required id="cardNumber">
                            </div>
                            <div class="col-lg-12 pb-4">
                                <label for="cardType" class="form-text pb-2">Card’s Type</label>
                                <select name="cardType" class="form-select py-2 rounded-2 form" id="cardType" required
                                    style="width: 100% !important;">
                                    <option value="DebitCard" class="form-opt w-100 py-3" selected>Debit Card</option>
                                    <option value="CreditCard" class="form-opt">Credit Card</option>
                                    <option value="VirtualCard" class="form-opt">Virtual Card</option>
                                    <option value="PrepaidCard" class="form-opt">Prepaid Card</option>
                                </select>
                            </div>
                            <div class="col-lg-12">
                                <div class="row">
                                    <!-- expirry date section -->
                                    <div class="col-lg-6">
                                        <label for="expiryDate" class="form-text pb-2">Expiry date</label>
                                        <input type="text" class="form py-2 w-100 ps-2 ps-lg-3 rounded-2"
                                            placeholder="mm/yy" name="expiryDate" maxlength="5" inputmode="numeric"
                                            autocomplete="cc-exp" required id="expiryDate">
                                    </div>
                                    <!-- cvv setion -->
                                    <div class="col-lg-6">
                                        <label for="cvv" class="form-text pb-2">Cvv</label>
                                        <input type="password" class="form py-2 w-100 ps-2 ps-lg-3 rounded-2" name="cvv"
                                            placeholder="***" inputmode="numeric" autocomplete="cc-csc" id="cvv"
                                            maxlength="4" required>
                                    </div>
                                </div>
                            </div>
                            <div class="pt-5">
                                <button type="submit" class="pay py-4 border-0 rounded-3 w-100">Pay Now</button>
                            </div>
                        </fieldset>
                    </form>
