<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champ log in</title>
    <link rel="icon" href="assests/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./Log-in.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <div class="container pt-5 pb-5">
        <section>
            <div class="d-flex justify-content-center pt-lg-4">
                <div class="row">
                    <!-- image column -->
                    <div class="col-md-6 col-lg-6 col-xl-6">
                        <img src="assests/form-image.png" alt="blue chair" class="w-100">
                    </div>
                    <!-- form column -->
                    <div class="col-md-6 col-lg-6  col-xl-6 ps-lg-5">
                        <div class="input-group px-lg-3 position-relative">
                            <div class="input-group d-flex justify-content-center">
                                <h1 class="create pb-3">WELCOME!!!</h1>
                            </div>
                            <div class="w-100" id="signupform">
                                <div class="mb-4">
                                    <label for="mail" class="form-text pb-2">Email</label>
                                    <input type="email" name="email" class="form-control w-100 form-2" autocomplete="email"
                                        placeholder="olabimpe322@gmail.com" id="mail" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-text pb-2">Password</label>
                                    <input type="password" name="password" class="form-control w-100 form-2" placeholder="*************"
                                        id="password" required>    
                                </div>
                                <p class="text-end"><a href="" class="for text-end text-decoration-none">Forgot Password?</a></p>
                                <div class="pt-3">
                                    <button type="button" class="create-btn w-100 border-0 py-3 rounded-2" id="submit-btn">Login</button>
                                </div>
                                <p class="already pt-4 text-center">Don’t have an account? <a href="sign-in.html" class="log text-decoration-none">Sign up </a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
