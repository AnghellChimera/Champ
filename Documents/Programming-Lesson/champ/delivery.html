            <div class="row">
                <!-- first column -->
                <div class="col-md-5 col-lg-6">
                    <form action="post" id="deliverydetails">
                        <fieldset>
                            <legend class="del pb-5">Delivery Details</legend>
                            <div class="pb-3">
                                <label for="state" class="form-text pb-2">State</label>
                                <select name="State" class="form-select py-2 rounded-2 form-1" id="state" required>
                                    <option value="Ogun" selected class="form-opt">Ogun</option>
                                    <option value="Oyo" class="form-opt">Oyo</option>
                                    <option value="Lagos" class="form-opt">Lagos</option>
                                    <option value="Osun" class="form-opt">Osun</option>
                                    <option value="Kwara" class="form-opt">Kwara</option>
                                </select>
                            </div>
                            <div class="pb-3">
                                <label for="local" class="form-text pb-2">Local Government Area</label>
                                <select name="Local Government Area" class="form-select py-2 rounded-2 form-1"
                                    id="local" required>
                                    <option value="Abeokuta South" class="form-opt" selected>Abeokuta South</option>
                                    <option value="Ibadan-North" class="form-opt">Ibadan North</option>
                                    <option value="Ikeja" class="form-opt">Ikeja</option>
                                    <option value="Osogbo" class="form-opt">Osogbo</option>
                                    <option value="Ilorin-West" class="form-opt">Ilorin West</option>
                                </select>
                            </div>
                            <div class="pb-4">
                                <label for="address" class="form-text pb-2">Street Address</label>
                                <input type="text" name="Address" class="form-2 py-2 ps-md-3 rounded-2 w-100"
                                    placeholder="Pro Hub, Idi-aba, Abeokuta" id="address" required>
                            </div>
                        </fieldset>
                        <fieldset>
                            <legend class="how pt-5 pb-4">How do you want your delivery?</legend>
                            <div class="row">
                                <!-- check box 1 -->
                                <div class="col-lg-5 pb-3">
                                    <label for="door" class="check-text pb-1">Door Delivery</label>
                                    <div class="form-check">
                                        <input type="radio" checked name="deliveryMode" class="form-check-input chec-b box" id="door" value="Door Delivery" required>
                                    </div>
                                </div>
                                <!-- check box 2 -->
                                <div class="col-lg-5 pb-3">
                                    <label for="station" class="check-text pb-1">Pick-up Station</label>
                                    <div class="form-check">
                                        <input type="radio" name="deliveryMode" class="form-check-input chec-b box" id="station" value="Pick-up Station" required>
                                    </div>
                                </div>
                                <div class="pt-5">
                                    <button type="submit" class="next py-4 border-0 rounded-3 w-100">Next</button>
                                </div>
                            </div>
                        </fieldset>
                    </form>
                </div>
                <!-- secound column -->
